    .frame{fill:#fff;stroke:#d8dee4;stroke-width:1}
    .grid{stroke:#eef1f4;stroke-width:1}
    .ink{fill:#1f2328}
    .copy{fill:#2563eb}
    .settled{fill:#1f2328}
    .skip{stroke:#dc2626;stroke-width:3;stroke-linecap:square}
    .copySelect{animation:copySelect 4.4s ease-in-out infinite}
    .copyMove{transform-box:fill-box;transform-origin:0 0;animation:copyMove 4.4s ease-in-out infinite}
    .copySettle{animation:copySettle 4.4s ease-in-out infinite}
    .skipLayer{animation:skipShow 4.4s ease-in-out infinite}
    .label{font:18px system-ui,sans-serif;fill:#1f2328}
    .small{font:13px system-ui,sans-serif;fill:#57606a}
    .arrow{stroke:#6b7280;stroke-width:2;fill:none;marker-end:url(#arrow)}
    @keyframes skipShow{0%,8%{opacity:0}16%,38%{opacity:1}50%,82%{opacity:.45}92%,100%{opacity:0}}
    @keyframes copySelect{0%,26%{opacity:0}32%,44%{opacity:.88}52%,100%{opacity:0}}
    @keyframes copyMove{0%,48%{opacity:0;transform:translate(0,0)}54%{opacity:.88;transform:translate(0,0)}66%,78%{opacity:.88;transform:translate(14px,0)}86%,100%{opacity:0;transform:translate(14px,0)}}
    @keyframes copySettle{0%,76%{opacity:0}86%,96%{opacity:1}100%{opacity:0}}
  </style>
