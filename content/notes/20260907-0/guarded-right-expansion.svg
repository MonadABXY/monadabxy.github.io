<svg xmlns="http://www.w3.org/2000/svg" width="804" height="330" viewBox="0 0 804 330" role="img" aria-labelledby="title desc">
  <title id="title">보호 확장</title>
  <desc id="desc">복사하려는 칸이나 그 다음 칸이 이미 차 있으면 복사를 생략하고, 허용된 픽셀만 오른쪽으로 복사한다.</desc>
